<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WPFind</title>
<style>
  :root {
    --ground: #f6f7f7;
    --surface: #ffffff;
    --ink: #1d2327;
    --muted: #646970;
    --line: #d5d8da;
    --accent: #2271b1;
    --ghost: #787c82;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    width: 380px;
    background: var(--ground);
    color: var(--ink);
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 0;
  }

  .brand img { display: block; }

  .brand .name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .search { padding: 10px 10px 6px; }

  #q {
    width: 100%;
    margin: 0;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: inherit;
    font: inherit;
    outline: none;
  }

  #q::placeholder { color: var(--muted); }

  #q:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(34, 113, 177, 0.15);
  }

  #q:disabled {
    background: #ecedee;
    border-color: #e3e5e8;
    color: var(--muted);
  }

  .list {
    margin: 0;
    padding: 2px 0 8px;
    list-style: none;
    max-height: 372px;
    overflow-y: auto;
  }

  .list::-webkit-scrollbar { width: 9px; }
  .list::-webkit-scrollbar-thumb {
    background: #c3c4c7;
    background-clip: padding-box;
    border: 3px solid transparent;
    border-radius: 9px;
  }
  .list:hover::-webkit-scrollbar-thumb { background: #a7aaad; background-clip: padding-box; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 14px;
    cursor: pointer;
  }

  .row.group {
    margin-top: 7px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  .row.active {
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
  }

  .row.active::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 2px;
    background: var(--accent);
  }

  .row.active .ico { color: var(--accent); }

  .ico {
    flex: 0 0 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ghost);
  }

  .ico img {
    max-width: 18px;
    max-height: 18px;
    object-fit: contain;
  }

  .dash {
    font-family: wpfind-dashicons;
    font-size: 18px;
    line-height: 1;
  }

  .row .label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }

  .row.sub .label {
    padding-left: 10px;
    font-weight: 400;
  }

  .row .parent {
    flex: 0 0 auto;
    max-width: 124px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 11px;
  }

  .hit { color: var(--accent); font-weight: 600; }

  .status {
    margin: 0;
    padding: 20px 16px;
    color: var(--muted);
    text-align: center;
  }

  .status[hidden] { display: none; }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 12px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
  }

  .count { font-variant-numeric: tabular-nums; }

  kbd {
    display: inline-block;
    min-width: 15px;
    padding: 0 3px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    line-height: 15px;
    text-align: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    .list { animation: settle 150ms cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes settle {
      from { opacity: 0; transform: translateY(3px); }
    }
  }
</style>
</head>
<body>
  <header class="brand">
    <img src="icons/icon48.png" alt="WPFind logo" width="24" height="24">
    <span class="name">WPFind</span>
  </header>
  <div class="search">
    <input id="q" type="text" placeholder="Search WordPress menus" autocomplete="off" spellcheck="false" disabled>
  </div>
  <ul id="list" class="list" role="listbox" aria-label="WordPress admin menus"></ul>
  <p id="status" class="status">Reading menus&hellip;</p>
  <footer class="foot">
    <span id="count"></span>
    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move &middot; <kbd>&crarr;</kbd> open</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
